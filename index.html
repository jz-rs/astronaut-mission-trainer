<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1a1423" />
    <title>Astronaut Mission Trainer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #1a1423; overflow: hidden; touch-action: none; }
      #game { width: 100%; height: 100%; }
      canvas { image-rendering: pixelated; }
      #rotate-overlay {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: #1a1423; color: #f4f1e8;
        font-family: "Press Start 2P", monospace; font-size: 14px; line-height: 1.6;
        flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px;
      }
      #rotate-overlay .rotate-icon { font-size: 56px; margin-bottom: 16px; }
      @media (orientation: portrait) { #rotate-overlay { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
